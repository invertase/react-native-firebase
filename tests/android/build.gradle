buildscript {
  ext.buildToolsVersion = "36.1.0"
  ext.minSdkVersion = 24
  ext.compileSdkVersion = 36
  // Test *app* targetSdk only. Do not set rootProject.ext.targetSdkVersion —
  // invertase applyAndroidVersions() copies it onto RNFB libraries, and
  // Robolectric 4.14.1 DefaultSdkPicker then rejects package targetSdk 36
  // (maxSdk 35). Libraries keep packages/*/package.json (app: 34). AndroidTest-AD-1.
  ext.appTargetSdkVersion = 36

 ext.ndkVersion = "27.1.12297006"

  // async-storage 3.x ships shared-storage / kotlin-stdlib with metadata 2.2.0 — compiler must be ≥ 2.2
  ext.kotlinVersion = '2.2.10' // https://kotlinlang.org/releases.html
  ext.supportLibVersion = '1.17.0' // this maps to androidx.core https://developer.android.com/jetpack/androidx/releases/core
  ext.appCompatVersion = '1.7.1' // this maps to androidx.appcompat https://developer.android.com/jetpack/androidx/releases/appcompat
  ext.supportVersion = ext.supportLibVersion
  ext.frescoVersion = '3.6.0' // https://github.com/facebook/fresco/releases
  ext.fragmentVersion = '1.8.9' // https://developer.android.com/jetpack/androidx/releases/fragment
  ext.vectordrawableVersion = '1.2.0' // https://developer.android.com/jetpack/androidx/releases/vectordrawable
  ext.androidxAnnotationVersion = '1.9.1' // https://developer.android.com/jetpack/androidx/releases/annotation
  ext.googlePlayServicesLocationVersion = '21.5.1' // https://developers.google.com/android/guides/setup
  ext.googlePlayServicesVersion = '18.10.0' // play-services-base
  ext.googlePlayServicesAuthVersion = '21.4.0' // play-services-auth
  ext.googlePlayServicesVisionVersion = '20.1.3' // play-services-vision
  ext.googlePlayServicesIidVersion = '17.0.0' // play-services-iid - deprecated, device-info only
  ext.mediaCompatVersion = '1.7.1' // https://developer.android.com/jetpack/androidx/releases/media
  ext.supportV4Version = '1.0.0' // https://developer.android.com/jetpack/androidx/releases/legacy androidx.legacy:legacy-support-v4
  ext.swiperefreshlayoutVersion = '1.2.0' // https://developer.android.com/jetpack/androidx/releases/swiperefreshlayout

  // used to aggregate all modules for later reporting
  ext.firebaseModulePaths = []

  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath 'com.google.gms:google-services:4.5.0' // https://developers.google.com/android/guides/google-services-plugin
    classpath 'com.android.tools.build:gradle:8.13.1' // https://mvnrepository.com/artifact/com.android.tools.build/gradle?repo=google
    classpath("com.facebook.react:react-native-gradle-plugin")
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    classpath 'com.google.firebase:perf-plugin:2.0.2'
    classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.8'
    classpath 'com.google.firebase:firebase-appdistribution-gradle:5.3.0'
  }
}

// In-place coverage neutralization: library matchers from coverage.properties
// (generated from tests/react-native-coverage.config.js).
def coverageProps = new Properties()
def coveragePropsFile = file('coverage.properties')
if (coveragePropsFile.exists()) {
  coveragePropsFile.withInputStream { coverageProps.load(it) }
}
def coverageLibraryMatchers = (coverageProps.getProperty('coverage.libraryProjectMatchers', 'react-native-firebase')
  .split(',')
  .collect { it.trim() }
  .findAll { !it.isEmpty() })
rootProject.ext.coverageLibraryProjectMatchers = coverageLibraryMatchers

// collect all our modules for reporting
subprojects.forEach { project ->
  if (coverageLibraryMatchers.any { matcher -> project.name.contains(matcher) }) {
    rootProject.ext.firebaseModulePaths << project.projectDir
  }
}

subprojects {
  tasks.register('listAllDependencies', DependencyReportTask) {}

  // Force all subprojects to use one and only one set of versions
  ext {
    compileSdk = rootProject.ext.compileSdkVersion
    minSdk = rootProject.ext.minSdkVersion
  }
  afterEvaluate { project ->
    if (!project.name.equalsIgnoreCase('app')
      && project.hasProperty('android')) {
      android {
        compileSdkVersion = compileSdk
        defaultConfig {
          minSdkVersion = minSdk
          // Do not overwrite library targetSdk (packages/*/package.json, typically 34).
          // Forcing the test-app targetSdk 36 makes Robolectric 4.14.1 DefaultSdkPicker
          // reject package targetSdkVersion=36 > maxSdkVersion=35 — AndroidTest-AD-1.
        }
      }
    }

    // Configure testing settings - if set in module build.gradle files they affect library consumers
    if (rootProject.ext.coverageLibraryProjectMatchers.any { matcher -> project.name.contains(matcher) }
      && project.hasProperty('android')) {
      // Jacoco plugin for JVM unit .exec (AGP enableUnitTestCoverage on libraries yields
      // exec files without product-class probes — see jacoco#1265). Keep androidTest
      // coverage for Detox on-device .ec instrumentation.
      project.pluginManager.apply('jacoco')
      project.jacoco {
        toolVersion = '0.8.14'
      }
      project.tasks.withType(Test).configureEach { testTask ->
        testTask.jacoco.includeNoLocationClasses = true
        testTask.jacoco.excludes = ['jdk.internal.*']
      }

      android {
        buildTypes.debug {
          // Detox / on-device coverage.ec needs instrumented library classes in the app.
          enableAndroidTestCoverage = true
          // Do not use enableUnitTestCoverage here — empty product probes on library modules.
          enableUnitTestCoverage = false
        }
        jacoco.version = '0.8.14'
        testOptions.unitTests.includeAndroidResources = true

        // Make sure our projects are run through basic lint checks.
        // AGP 8 `lint {}` DSL: `lintOptions {}` left lintConfig unused for some library
        // modules under AGP 8.13+ (InvalidPackage / RestrictedApi still aborted).
        lint {
          abortOnError = true
          warningsAsErrors = false
          lintConfig = file("${rootProject.projectDir}/lint.xml")
          disable 'InvalidPackage', 'GradleCompatible', 'RestrictedApi',
            'UnknownNullness', 'SyntheticAccessor', 'LogConditional'
          checkReleaseBuilds = true
          checkAllWarnings = true
          showAll = true
          textReport = true
          htmlReport = true
        }
      }
    }
  }
}

apply plugin: "com.facebook.react.rootproject"
