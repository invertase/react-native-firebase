version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: 'npm'
    # Look for `package.json` and `lock` files in the `root` directory
    directory: '/'
    allow:
      - dependency-type: 'production'
    # Check the npm registry for updates every day (weekdays)
    schedule:
      interval: 'daily'
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    labels:
      - 'dependencies'
    # Batch noisy minor/patch bumps; keep majors as individual PRs for review.
    groups:
      npm-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    # Workflow files stored in the
    # default location of `.github/workflows`
    directory: '/'
    schedule:
      interval: 'daily'
    cooldown:
      default-days: 7
    labels:
      - 'dependencies'
    # Actions bumps are high-volume and usually compatible; one PR per interval.
    groups:
      github-actions:
        patterns:
          - '*'

  # iOS Ruby SimpleCov gems (packages/app/__tests__/Gemfile + Gemfile.lock)
  - package-ecosystem: 'bundler'
    directory: '/packages/app/__tests__'
    schedule:
      interval: 'daily'
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    labels:
      - 'dependencies'
    # Test-only Gemfile; batch minor/patch, leave majors ungrouped.
    groups:
      bundler-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
