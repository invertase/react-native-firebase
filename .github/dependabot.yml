version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: 'npm'
    # Look for `package.json` and `lock` files in the `root` directory
    directory: '/'
    allow:
      - dependency-type: 'production'
    # Check the npm registry for updates every day (weekdays)
    schedule:
      interval: 'daily'
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    labels:
      - 'dependencies'
    groups:
      npm-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
        # Test-app pins (okf-bundle/testing/test-app-dependency-pins.md) stay as
        # individual PRs so one pinned package cannot turn the whole group red.
        exclude-patterns:
          - 'react'
          - '@types/react'
          - 'react-native'
          - 'react-native-*'
          - '@react-native/*'
          - '@react-native-community/*'
          - '@react-native-async-storage/*'
          - '@react-native-firebase/*'
          - 'expo'
          - 'expo-*'
          - 'babel-preset-expo'

  - package-ecosystem: 'github-actions'
    # Workflow files stored in the
    # default location of `.github/workflows`
    directory: '/'
    schedule:
      interval: 'daily'
    cooldown:
      default-days: 7
    labels:
      - 'dependencies'
    groups:
      github-actions-minor-patch:
        update-types:
          - 'minor'
          - 'patch'

  # Root Gemfile (CocoaPods, xcodeproj, SimpleCov, RuboCop)
  - package-ecosystem: 'bundler'
    directory: '/'
    schedule:
      interval: 'daily'
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    labels:
      - 'dependencies'
    groups:
      bundler-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
