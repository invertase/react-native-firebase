name: 'Build Harness Expo (Latest RN)'

# Proof of concept: builds the Expo harness (Debug and Release) against
# apps/build-harness-expo's own declared react-native version instead of the
# root package.json's repo-wide resolutions pin (see scripts/check-root-rn-pin.mjs
# and scripts/dev-harness-versions.sh for why that pin normally forces every
# workspace, including this harness, onto one shared react-native version).

on:
  workflow_dispatch:
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - '.spellcheck.dict.txt'
      - '**/*.md'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - '.spellcheck.dict.txt'
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS (Expo, latest RN)
    runs-on: macos-15
    timeout-minutes: 80
    env:
      # Keep in sync with build_harnesses.yml, which tracks latest-stable
      # because Firebase iOS SDK updates can require newer Xcode versions.
      XCODE_VERSION: latest-stable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      # `runner` is not valid in job-level `env`; set paths in a step so
      # `${{ runner.temp }}` is evaluated in a context that supports it.
      - name: Set CI Firebase config paths
        run: |
          echo "IOS_GOOGLE_SERVICES_PATH=${{ runner.temp }}/GoogleService-Info.plist" >> "$GITHUB_ENV"
          echo "ANDROID_GOOGLE_SERVICES_PATH=${{ runner.temp }}/google-services.json" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Create CI Firebase config files
        run: bash ./scripts/write-ci-firebase-configs.sh "${IOS_GOOGLE_SERVICES_PATH}" "${ANDROID_GOOGLE_SERVICES_PATH}"

      - name: Cache CocoaPods and specs
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: ${{ runner.os }}-harness-expo-latest-rn-pods-v1-${{ hashFiles('yarn.lock', 'apps/build-harness-expo/package.json', 'apps/build-harness-expo/app.config.js') }}
          restore-keys: |
            ${{ runner.os }}-harness-expo-latest-rn-pods-v1-

      - name: Yarn install
        run: yarn

      - name: Enable latest RN for the Expo harness
        run: yarn harness:expo:latest-rn:enable

      - name: Sync Expo harness
        run: yarn harness:expo:sync:ios

      - name: Prebuild Expo iOS harness
        run: yarn harness:expo:prebuild:ios

      - name: Build Expo iOS harness (Debug)
        run: yarn harness:expo:build:ios:debug

      - name: Build Expo iOS harness (Release)
        run: yarn harness:expo:build:ios:release
