name: Publish

on:
  workflow_dispatch:

jobs:
  publish_npm:
    if: "(github.repository == 'invertase/react-native-firebase') && (github.event_name == 'workflow_dispatch')"
    name: 'NPM'
    timeout-minutes: 60
    runs-on: macos-26
    permissions:
      id-token: write # enables OIDC for npmjs.com "Trusted Publisher" and provenance
      contents: read
    env:
      # macos-26 + latest-stable matches tests_e2e_ios.yml; needed for CocoaPods in scripts/version.js
      XCODE_VERSION: latest-stable
    steps:
      # https://github.com/actions/checkout/releases
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Repository admin required to evade PR+checks branch protection
          token: ${{ secrets.GH_TOKEN }}
      # https://github.com/maxim-lobanov/setup-xcode/releases
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
      # https://github.com/actions/setup-node/releases
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Install latest NPM
        # OIDC publishing requires a very up to date npm version
        run: |
          npm --version
          npm install -g npm@latest
          npm --version
      - name: Yarn Install
        # https://github.com/nick-fields/retry/releases
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 15
          retry_wait_seconds: 60
          max_attempts: 3
          command: yarn
      - name: Setup Ruby
        # https://github.com/ruby/setup-ruby/releases
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: 3
      # Pinned cocoapods/xcodeproj from the root Gemfile. yarn tests:ios:pod:install
      # and yarn tests:macos:pod:install use `bundle exec pod`. BUNDLE_FROZEN fails
      # CI on Gemfile.lock drift (do not use deprecated --frozen; it would persist
      # into .bundle/config). Do not gem update cocoapods.
      - name: Bundle install
        # https://github.com/nick-fields/retry/releases
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          retry_wait_seconds: 60
          max_attempts: 3
          command: BUNDLE_FROZEN=true bundle install
      - name: GIT Setup
        # Alter branding of release commit, despite GITHUB_TOKEN having real owner
        run: |
          git config --global user.name 'Invertase Publisher'
          git config --global user.email 'oss@invertase.io'
      - name: Publish Packages
        run: |
          npx envinfo
          echo "Verifying working directory is clean..."
          git diff --exit-code
          echo "Displaying any current changes..."
          if yarn lerna changed; then
            echo "Changes detected, bumping versions..."
            yarn lerna version --yes --force-publish=*
          else
            echo "No changes detected, no versions bumped."
          fi
          echo "Syncing unpublished versions with package registry..."
          yarn lerna publish from-package --yes --loglevel trace
        env:
          # Packages are configured on npmjs.com as OIDC Trusted Publisher for this workflow.
          # org admin Github Token required for the changelog/tag commit+push
          # to work via an exception to branch protection rules
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  deploy-api-reference:
    name: 'Deploy API Reference'
    needs: publish_npm
    uses: ./.github/workflows/deploy-api-reference.yml
    permissions:
      contents: read
      pages: write
      id-token: write
