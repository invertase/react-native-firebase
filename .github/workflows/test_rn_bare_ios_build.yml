name: Test RN CLI prebuilt RNCore iOS build

# Path-filtered ratchet for test-rn-bare/ (GitHub #8883): documented-default RN CLI SPM +
# dynamic + prebuilt-RNCore compile graph, plus iOS 27 UIScene launch smoke (also run for
# the dynamic Firebase probe, with framework load and configure assertions).

on:
  pull_request:
    branches:
      - '**'
    paths:
      - 'test-rn-bare/**'
      - 'packages/app/RNFBApp.podspec'
      - 'packages/app/package.json'
      - 'packages/app/ios/**'
      - 'packages/app/firebase_spm.rb'
      - 'packages/app/firebase_json.rb'
      - 'packages/app/plugin/**'
      - 'packages/app/app.plugin.js'
      - 'scripts/e2e/lib/ios-simulator-helpers.sh'
      - '.github/workflows/test_rn_bare_ios_build.yml'
      - '.github/workflows/scripts/check_rnfb_app_ios_objc_imports.rb'
      - '.github/workflows/scripts/check-ios-probe-sdk-pin.js'
      - '.github/workflows/scripts/test-rn-bare-ios-build.sh'
      - '.github/workflows/scripts/lib/rn-bare-probe-assertions.sh'
      - '.github/workflows/scripts/lib/rn-bare-probe-launch-assertions.sh'
      - '.github/workflows/scripts/test-rn-bare-ios-launch-smoke.sh'
      - '.github/workflows/scripts/configure-apple-ci.sh'
      - 'packages/app/__tests__/rnfb_app_ios_objc_import_guard_test.rb'
      - 'packages/app/__tests__/iosProbeSdkPin.test.js'
      - 'packages/app/__tests__/iosProbeSingleCopyAssertions.test.js'
      - 'packages/app/__tests__/iosProbeLaunchSmoke.test.js'
  push:
    branches:
      - main
      - release-v*
    paths:
      - 'test-rn-bare/**'
      - 'packages/app/RNFBApp.podspec'
      - 'packages/app/package.json'
      - 'packages/app/ios/**'
      - 'packages/app/firebase_spm.rb'
      - 'packages/app/firebase_json.rb'
      - 'packages/app/plugin/**'
      - 'packages/app/app.plugin.js'
      - 'scripts/e2e/lib/ios-simulator-helpers.sh'
      - '.github/workflows/test_rn_bare_ios_build.yml'
      - '.github/workflows/scripts/check_rnfb_app_ios_objc_imports.rb'
      - '.github/workflows/scripts/check-ios-probe-sdk-pin.js'
      - '.github/workflows/scripts/test-rn-bare-ios-build.sh'
      - '.github/workflows/scripts/lib/rn-bare-probe-assertions.sh'
      - '.github/workflows/scripts/lib/rn-bare-probe-launch-assertions.sh'
      - '.github/workflows/scripts/test-rn-bare-ios-launch-smoke.sh'
      - '.github/workflows/scripts/configure-apple-ci.sh'
      - 'packages/app/__tests__/rnfb_app_ios_objc_import_guard_test.rb'
      - 'packages/app/__tests__/iosProbeSdkPin.test.js'
      - 'packages/app/__tests__/iosProbeSingleCopyAssertions.test.js'
      - 'packages/app/__tests__/iosProbeLaunchSmoke.test.js'

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-rn-bare-ios-build:
    name: test-rn-bare iOS build + launch smoke
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      XCODE_VERSION: '27.0'
      RNFB_IOS_SIM_RUNTIME: iOS 27.0
      CCACHE_SLOPPINESS: clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros
      CCACHE_FILECLONE: true
      CCACHE_DEPEND: true
      CCACHE_INODECACHE: true
      CCACHE_LIMIT_MULTIPLE: 0.95
      # Prefer PATH ccache wrappers from ccache-action (create-symlink). Do not set LD/LDPLUSPLUS (Xcode 27 trap).
      # Build/launch scripts also pass CC=clang CPLUSPLUS=clang++ as xcodebuild settings.
      CC: clang
      CPLUSPLUS: clang++
    steps:
      # https://github.com/actions/checkout/releases
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # https://github.com/actions/setup-node/releases
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # https://github.com/maxim-lobanov/setup-xcode/releases
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Configure Apple CI (Xcode 27 + iOS 27 runtime)
        run: bash .github/workflows/scripts/configure-apple-ci.sh

      # Sticky content-hash key (append-timestamp: false). Distinct from e2e/expo (`rn-bare` app id).
      # https://github.com/hendrikmuhs/ccache-action/releases
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        name: Xcode Compile Cache
        with:
          key: ${{ runner.os }}-rn-bare-ios-v1-xcode27-${{ hashFiles('yarn.lock', 'test-rn-bare/**', 'packages/app/ios/**', 'packages/app/*.podspec', 'packages/app/firebase_spm.rb', 'packages/app/firebase_json.rb', 'packages/app/plugin/**', 'packages/app/app.plugin.js') }}
          append-timestamp: false
          save: ${{ github.ref == 'refs/heads/main' }}
          create-symlink: true
          max-size: 1500M

      - name: Yarn Install
        run: yarn

      - name: ccache stats (before)
        run: ccache -s || true

      - name: test-rn-bare iOS build
        run: yarn test-rn-bare:ios:build

      - name: test-rn-bare iOS launch smoke
        run: yarn test-rn-bare:ios:launch-smoke

      - name: ccache stats (after)
        if: always()
        run: ccache -s || true

  # Permanent probe: App links through the local dynamic RNFBFirebase package
  # instead of direct firebase-ios-sdk. Flag off job above stays the shipped path.
  test-rn-bare-ios-build-dynamic-firebase:
    name: test-rn-bare iOS build (dynamic Firebase probe)
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      XCODE_VERSION: '27.0'
      RNFB_IOS_SIM_RUNTIME: iOS 27.0
      RNFB_TEST_RN_BARE_DYNAMIC_FIREBASE: '1'
      RNFB_TEST_RN_BARE_POD_LOG: /tmp/test-rn-bare-pod-install-probe.log
      RNFB_TEST_RN_BARE_XCODEBUILD_LOG: /tmp/test-rn-bare-xcodebuild-probe.log
      RNFB_TEST_RN_BARE_DERIVED_DATA: /tmp/test-rn-bare-derived-data-probe
      # Launch smoke builds Debug into its own wiped DerivedData and launches only from it.
      RNFB_TEST_RN_BARE_LAUNCH_DERIVED_DATA: /tmp/test-rn-bare-launch-derived-data-probe
      RNFB_TEST_RN_BARE_LAUNCH_XCODEBUILD_LOG: /tmp/test-rn-bare-launch-smoke-xcodebuild-probe.log
      RNFB_TEST_RN_BARE_LAUNCH_LOG: /tmp/test-rn-bare-launch-smoke-probe.log
      RNFB_TEST_RN_BARE_METRO_LOG: /tmp/test-rn-bare-launch-smoke-metro-probe.log
      CCACHE_SLOPPINESS: clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros
      CCACHE_FILECLONE: true
      CCACHE_DEPEND: true
      CCACHE_INODECACHE: true
      CCACHE_LIMIT_MULTIPLE: 0.95
      # Prefer PATH ccache wrappers from ccache-action (create-symlink). Do not set LD/LDPLUSPLUS (Xcode 27 trap).
      # Build/launch scripts also pass CC=clang CPLUSPLUS=clang++ as xcodebuild settings.
      CC: clang
      CPLUSPLUS: clang++
    steps:
      # https://github.com/actions/checkout/releases
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # https://github.com/actions/setup-node/releases
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check probe SDK pin matches app SDK version
        run: node .github/workflows/scripts/check-ios-probe-sdk-pin.js

      # https://github.com/maxim-lobanov/setup-xcode/releases
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Configure Apple CI (Xcode 27 + iOS 27 runtime)
        run: bash .github/workflows/scripts/configure-apple-ci.sh

      # Sticky content-hash key (append-timestamp: false). Distinct from shipped-path job (`rn-bare-dynfb`).
      # https://github.com/hendrikmuhs/ccache-action/releases
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        name: Xcode Compile Cache
        with:
          key: ${{ runner.os }}-rn-bare-dynfb-ios-v1-xcode27-${{ hashFiles('yarn.lock', 'test-rn-bare/**', 'packages/app/ios/**', 'packages/app/*.podspec', 'packages/app/firebase_spm.rb', 'packages/app/firebase_json.rb', 'packages/app/plugin/**', 'packages/app/app.plugin.js', 'packages/app/package.json') }}
          append-timestamp: false
          save: ${{ github.ref == 'refs/heads/main' }}
          create-symlink: true
          max-size: 1500M

      - name: Yarn Install
        run: yarn

      - name: ccache stats (before)
        run: ccache -s || true

      - name: test-rn-bare iOS build (dynamic Firebase probe)
        run: yarn test-rn-bare:ios:build

      # Same pod install state as the build above (the smoke does not run pod install).
      # Probe mode asserts RNFBFirebase.framework is embedded and mapped into the
      # running app, and hard-gates on RNFB_PROBE_CONFIGURE_OK (I-COR is soft warn).
      - name: test-rn-bare iOS launch smoke (dynamic Firebase probe)
        run: yarn test-rn-bare:ios:launch-smoke

      # Paths match dynfb env above (probe launch / metro / xcodebuild logs + optional *.retro.txt).
      - name: Upload dynfb launch-smoke logs
        # https://github.com/actions/upload-artifact/releases
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        if: failure()
        with:
          name: rn-bare-dynfb-launch-smoke-logs
          path: |
            /tmp/test-rn-bare-launch-smoke-probe.log
            /tmp/test-rn-bare-launch-smoke-probe.log.retro.txt
            /tmp/test-rn-bare-launch-smoke-metro-probe.log
            /tmp/test-rn-bare-launch-smoke-xcodebuild-probe.log
          if-no-files-found: warn

      - name: ccache stats (after)
        if: always()
        run: ccache -s || true
