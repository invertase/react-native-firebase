---
name: Mark stale issues and pull requests
on:
  workflow_dispatch:
  schedule:
    - cron: 35 * * * *
permissions:
  issues: write
  pull-requests: write
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      # https://github.com/actions/stale/releases
      - uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10.4.0
        with:
          operations-per-run: 1000
          stale-issue-message: |
            Hello 👋, to help manage issues we automatically close stale issues.

            This issue has been automatically marked as stale because it has not had activity for quite some time.

            Has this issue been fixed, or does it still require attention?

            > This issue will be closed in 15 days if no further activity occurs.

            Thank you for your contributions.
          stale-pr-message: |
            Hello 👋, this PR has been opened for more than 14 days with no activity on it.

            If you think this is a mistake please comment and ping a maintainer to get this merged ASAP! Thanks for contributing!

            You have 7 days until this gets closed automatically
          exempt-issue-labels: 'Keep Open,Help: Good First Issue,Workflow: Needs Review,Needs Attention'
          exempt-pr-labels: 'Keep Open,Help: Good First Issue,Workflow: Needs Review,Needs Attention'
          close-issue-reason: not_planned
          days-before-stale: 14
          days-before-close: 21
          stale-issue-label: 'Stale'
